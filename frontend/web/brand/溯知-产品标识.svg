<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="溯知 · SuZhi">
  <!--
    溯知方标 512（鹿溪产品标四层）
    1 鹿溪绿圆角底 rx=112
    2 业务：三信源汇流成章（探索树 + 大纲成文）
    3 溪流 #00D2FF 自下而上（溯流求源）
    4 源启星 + 标题金落点
  -->
  <defs>
    <linearGradient id="sz-plate" x1="80" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#127A55"/>
      <stop offset="100%" stop-color="#0D5E42"/>
    </linearGradient>
    <linearGradient id="sz-water" x1="256" y1="430" x2="256" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#00D2FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sz-plate)"/>
  <circle cx="148" cy="118" r="108" fill="#ffffff" opacity="0.06"/>

  <!-- 成文章页 -->
  <rect x="186" y="92" width="140" height="196" rx="22" fill="#F5F7FA" opacity="0.08"
        stroke="#F5F7FA" stroke-width="14"/>
  <path d="M214 148 H312" fill="none" stroke="#F5F7FA" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
  <path d="M214 188 H298" fill="none" stroke="#F5F7FA" stroke-width="12" stroke-linecap="round" opacity="0.72"/>
  <path d="M214 228 H286" fill="none" stroke="#F5F7FA" stroke-width="12" stroke-linecap="round" opacity="0.5"/>

  <!-- 三信源探索树（自下而上汇入成文） -->
  <path d="M140 402 C168 352, 214 330, 256 292"
        fill="none" stroke="#F5F7FA" stroke-width="14" stroke-linecap="round" opacity="0.88"/>
  <path d="M256 428 C256 372, 256 330, 256 292"
        fill="none" stroke="#F5F7FA" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
  <path d="M372 402 C344 352, 298 330, 256 292"
        fill="none" stroke="#F5F7FA" stroke-width="14" stroke-linecap="round" opacity="0.88"/>
  <circle cx="140" cy="402" r="16" fill="#F5F7FA"/>
  <circle cx="256" cy="428" r="16" fill="#F5F7FA" opacity="0.85"/>
  <circle cx="372" cy="402" r="16" fill="#F5F7FA"/>

  <!-- 溪流：自下而上溯源 -->
  <path d="M256 448 C218 368, 298 318, 248 248 C214 196, 286 156, 256 108"
        fill="none" stroke="url(#sz-water)" stroke-width="20" stroke-linecap="round"/>

  <!-- 标题金落点：知汇成章 -->
  <circle cx="252" cy="248" r="18" fill="#F1C40F"/>
  <circle cx="246" cy="242" r="5" fill="#F5F7FA" opacity="0.85"/>

  <!-- 源启星 -->
  <g transform="translate(392 118)">
    <path d="M0-34 L7.2-7.2 L34 0 L7.2 7.2 L0 34 L-7.2 7.2 L-34 0 L-7.2-7.2 Z" fill="#00D2FF"/>
    <circle cx="0" cy="0" r="7" fill="#F5F7FA"/>
  </g>
</svg>
